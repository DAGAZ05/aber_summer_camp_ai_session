</g>
<g>
<rect x="527" y="208" width="112" height="64" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="583" y="230" text-anchor="middle" dominant-baseline="central" font-size="11.5" font-weight="500" fill="#0C447C">CSRT 跟踪</text>
<text x="583" y="248" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#185FA5">selectROI 手框</text>
<text x="583" y="264" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#185FA5">每 100 帧更新</text>
</g>
