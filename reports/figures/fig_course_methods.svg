<text x="74" y="158" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#5F5E5A">模型评估</text>

<g>
<rect x="116" y="116" width="112" height="64" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="172" y="138" text-anchor="middle" dominant-baseline="central" font-size="11.5" font-weight="500" fill="#0C447C">时长特征</text>
<text x="172" y="156" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#185FA5">闭合 / 停顿 / 张开</text>
<text x="172" y="172" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#185FA5">177 个事件</text>
</g>
<g>
<rect x="253" y="116" width="112" height="64" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="309" y="138" text-anchor="middle" dominant-baseline="central" font-size="11.5" font-weight="500" fill="#0C447C">分层 5 折 CV</text>
<text x="309" y="156" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#185FA5">StratifiedKFold</text>
<text x="309" y="172" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#185FA5">seed = 1 · 全样本折叠</text>
</g>
<g>
<rect x="390" y="116" width="112" height="64" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="446" y="138" text-anchor="middle" dominant-baseline="central" font-size="11.5" font-weight="500" fill="#0C447C">三种分类器</text>
<text x="446" y="156" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#185FA5">Dummy · 树 d=4</text>
<text x="446" y="172" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#185FA5">森林 75/6</text>
</g>
<g>
<rect x="527" y="116" width="112" height="64" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="583" y="138" text-anchor="middle" dominant-baseline="central" font-size="11.5" font-weight="500" fill="#0C447C">准确率</text>
<text x="583" y="156" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#185FA5">0.56 / 0.76 / 0.81</text>
<text x="583" y="172" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#185FA5">召回 86% / 74%</text>
</g>
