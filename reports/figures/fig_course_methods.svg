<line x1="505" y1="348" x2="523" y2="348" stroke="#888780" stroke-width="1.2" marker-end="url(#arrow)"/>

<path d="M583 272 V294 H172 V312" fill="none" stroke="#185FA5" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow)"/>

<text x="40" y="404" dominant-baseline="central" font-size="11.5" font-weight="500" fill="#444441">教学技法　模型之外，课程真正在训练的判断力</text>
<g>
<rect x="40" y="414" width="192" height="26" rx="6" fill="#F1EFE8" stroke="#D3D1C7" stroke-width="0.5"/>
<text x="136" y="427" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#444441">懒惰基线：多数类 0.56</text>
<rect x="244" y="414" width="192" height="26" rx="6" fill="#F1EFE8" stroke="#D3D1C7" stroke-width="0.5"/>
<text x="340" y="427" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#444441">深度 1–10 全扫看过拟合</text>
<rect x="448" y="414" width="192" height="26" rx="6" fill="#F1EFE8" stroke="#D3D1C7" stroke-width="0.5"/>
<text x="544" y="427" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#444441">窄阈值 0.016672–0.016685</text>
<rect x="40" y="448" width="192" height="26" rx="6" fill="#F1EFE8" stroke="#D3D1C7" stroke-width="0.5"/>
<text x="136" y="461" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#444441">10 次重复 CV 投票定误判</text>
<rect x="244" y="448" width="192" height="26" rx="6" fill="#F1EFE8" stroke="#D3D1C7" stroke-width="0.5"/>
<text x="340" y="461" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#444441">过度代表检验（视频 / 马匹）</text>
<rect x="448" y="448" width="192" height="26" rx="6" fill="#F1EFE8" stroke="#D3D1C7" stroke-width="0.5"/>
<text x="544" y="461" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#444441">3D 特征空间散点</text>
</g>

<rect x="40" y="494" width="600" height="46" rx="8" fill="#FAECE7" stroke="#D85A30" stroke-width="0.5" stroke-dasharray="5 3"/>
<text x="340" y="512" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="500" fill="#993C1D">课程止点：检测层没有任何量化指标（无 F1 / precision / 事件级评价）</text>
<text x="340" y="530" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#993C1D">阈值由肉眼在图上拖动选定，未报告命中数与误报数 —— 这正是延伸的起点</text>

