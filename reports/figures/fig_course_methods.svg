<text x="309" y="264" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#185FA5">亮度时序曲线</text>
</g>
<g>
<rect x="390" y="208" width="112" height="64" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
