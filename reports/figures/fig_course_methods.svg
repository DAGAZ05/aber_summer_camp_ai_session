<svg viewBox="0 0 680 580" width="100%" role="img" xmlns="http://www.w3.org/2000/svg" font-family="Microsoft YaHei, PingFang SC, Helvetica, Arial, sans-serif">
<title>课程三阶段方法栈</title>
<desc>课程由模型评估、视频管线、信号检测三阶段构成，图中标注各阶段所用方法与原文报告数值，并标出课程在检测层缺少量化指标的止点。</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect x="40" y="44" width="600" height="52" rx="8" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="340" y="66" text-anchor="middle" dominant-baseline="central" font-size="12.5" font-weight="500" fill="#444441">blink_events.csv　177 事件 · 4 匹马　|　M-006.mp4　1841 帧 · 59.93 fps</text>
<text x="340" y="85" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#5F5E5A">M-006_groundtruth.npy　逐帧 0/1 标注，与视频帧严格对齐</text>

