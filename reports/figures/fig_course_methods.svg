<line x1="368" y1="148" x2="386" y2="148" stroke="#888780" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="505" y1="148" x2="523" y2="148" stroke="#888780" stroke-width="1.2" marker-end="url(#arrow)"/>

