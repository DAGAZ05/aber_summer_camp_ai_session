<text x="172" y="338" text-anchor="middle" dominant-baseline="central" font-size="11.5" font-weight="500" fill="#0C447C">裁剪眼部视频</text>
<text x="172" y="356" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#185FA5">逐帧灰度均值</text>
<text x="172" y="372" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#185FA5">一条亮度序列</text>
</g>
<g>
<rect x="253" y="316" width="112" height="64" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="309" y="338" text-anchor="middle" dominant-baseline="central" font-size="11.5" font-weight="500" fill="#0C447C">滚动中值 3 s</text>
<text x="309" y="356" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#185FA5">估计慢变基线</text>
<text x="309" y="372" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#185FA5">相减后中心化到 0</text>
</g>
<g>
<rect x="390" y="316" width="112" height="64" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="446" y="338" text-anchor="middle" dominant-baseline="central" font-size="11.5" font-weight="500" fill="#0C447C">与真值对齐</text>
